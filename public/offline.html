<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ناشر — بدون إنترنت</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #f5f5f2; color: #1c1c1a; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; padding: 16px; }
      .card { background: #fff; border: 1px solid #e4e3de; border-radius: 16px; padding: 32px 24px; max-width: 340px; text-align: center; }
      .logo { width: 48px; height: 48px; border-radius: 12px; background: #1c1c1a; color: #fff; display: flex;
        align-items: center; justify-content: center; font-weight: 700; font-size: 22px; margin: 0 auto 16px; }
      p { color: #6b6b66; font-size: 14px; line-height: 1.7; }
      button { margin-top: 8px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #1c1c1a;
        color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">ن</div>
      <h1 style="font-size: 20px; margin: 0 0 8px">ما فيه إنترنت</h1>
      <p>تأكد من الاتصال وجرّب مرة ثانية. المنشورات المجدولة تنزل في وقتها حتى لو جوالك مطفي.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
